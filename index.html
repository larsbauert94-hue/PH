<title>Ringfahrt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;900&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap">
<style>
/* Layout: Lager (Szene + Kachelmenü) → Kapitelkarte → Kampfbühne (Canvas 16:9, HUD darunter). Bewusst einheitlich dunkel: Mittelerde bei Nacht. */
:root{
  --bg:#0f1216;       /* Nacht */
  --panel:#171c22;    /* Tafeln */
  --panel-2:#1f262e;
  --line:#2f3a44;
  --fg:#e9e2cf;       /* Pergament */
  --muted:#93a0a6;
  --gold:#e0b552; --gold-2:#ffd97a;
  --ember:#d86240;
  --tank:#6fa3e0; --dd:#e0745a; --heal:#7fd17a;
  --font-pixel:'Cinzel','Trajan Pro',Georgia,serif;
  --font-body:'Alegreya Sans','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.45;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
canvas.pix,canvas.pt,canvas.ic{display:block}
h1,h2,h3{font-family:var(--font-pixel);font-weight:600;margin:0;letter-spacing:.02em;text-wrap:balance}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.wrap.narrow{max-width:760px}
.muted{color:var(--muted)} .center{text-align:center} .gold-t{color:var(--gold-2)}
.kicker{font-family:var(--font-pixel);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.row.center{justify-content:center}
/* Pixel-Rahmen */
.btn{font-family:var(--font-body);font-size:15px;font-weight:700;letter-spacing:.02em;background:linear-gradient(#27303a,#1c232b);border:1px solid #3a4652;border-radius:9px;padding:9px 15px;cursor:pointer;color:var(--fg);
  box-shadow:0 1px 0 #ffffff10 inset, 0 4px 12px #0006;transition:transform .12s ease, background .15s, border-color .15s, box-shadow .15s;touch-action:manipulation}
.btn:hover:not(:disabled){border-color:var(--gold);transform:translateY(-1px);box-shadow:0 1px 0 #ffffff10 inset, 0 6px 16px #0008}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--gold-2);outline-offset:3px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:linear-gradient(#f0c766,#b8862e);color:#1d1406;border-color:#ffe2a0}
.btn.primary:hover:not(:disabled){background:linear-gradient(#ffd77a,#c8963a)}
.btn.danger{background:linear-gradient(#7a3328,#5a2018);border-color:#9a4a3a}
.btn.ghost{background:#ffffff06;box-shadow:none}
.btn.on{background:linear-gradient(#4a4020,#2e2812);border-color:var(--gold);color:var(--gold-2)}
.btn.small{font-size:13px;padding:5px 9px}
.btn.big{font-size:19px;padding:13px 22px}
.panel{background:linear-gradient(160deg,#1c232b,#14191f);padding:22px;border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 40px #0008}
.bar{height:6px;background:#06080a;position:relative;overflow:hidden;border-radius:99px}
.bar i{display:block;height:100%;width:0;transition:width .35s cubic-bezier(.2,.8,.2,1);border-radius:99px}
.bar.hp i{background:linear-gradient(#7fe07a,#3fa040)}
.bar.xp i{background:linear-gradient(#ffe08a,#c89a30)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--gold);border-radius:10px;padding:9px 16px;z-index:90;font-weight:700;animation:fadeup .35s ease-out}
#modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:16px}
#modal .mbox{max-width:720px;width:100%;max-height:calc(100% - 32px);overflow:auto;background:linear-gradient(160deg,#1e252d,#14191f);padding:22px;border:1px solid var(--gold);border-radius:16px;animation:fadeup .3s ease-out}
.help h3{margin:14px 0 4px;color:var(--gold-2);font-size:16px} .help ul{padding-left:20px;margin:4px 0}
.r-tank{color:var(--tank)} .r-dd{color:var(--dd)} .r-heal{color:var(--heal)}
.role{font-family:var(--font-pixel);font-size:11px;padding:1px 6px;box-shadow:0 0 0 1px currentColor;display:inline-block;line-height:1.4}
.role.r-tank{color:var(--tank)} .role.r-dd{color:var(--dd)} .role.r-heal{color:var(--heal)}

/* Titel */
.title{min-height:100%;display:flex;flex-direction:column}
.tscene{width:100%;max-height:52vh;aspect-ratio:256/100;display:block;object-fit:cover}
.title-in{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.logo{font-size:clamp(44px,12vw,96px);font-weight:900;letter-spacing:.1em;background:linear-gradient(#fff4cf,#e0b552 55%,#8a5e1e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 14px #000)}
.lead{max-width:36em;color:#d6cfbd;margin:0}
.menu{display:flex;flex-direction:column;gap:12px;width:min(320px,100%);margin-top:6px}
.confirm{font-size:14px;color:var(--muted)}
.foot{font-size:12px;color:var(--muted);max-width:40em}

/* Kopfzeile */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#0b0e11ee;box-shadow:0 2px 0 #06080a}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:#0b0e11}
.tb-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.tb-title{font-size:clamp(16px,3.5vw,22px);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res{display:flex;gap:10px;font-family:var(--font-pixel);font-size:15px;white-space:nowrap}
.res .gold{color:var(--gold-2)} .res .mith{color:#a8e0ff} .res .pow{color:#ffb070}

/* Lager */
.scene-box{border-radius:16px;overflow:hidden;box-shadow:0 12px 40px #000a;margin:4px 0 16px}
.scene-box canvas{width:100%;display:block;aspect-ratio:256/100}
.runbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#2a2412;padding:10px 14px;border:1px solid var(--gold);border-radius:12px;margin-bottom:14px}
.runbar span{flex:1;min-width:12em}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:linear-gradient(160deg,#1e252d,#151a20);border:1px solid var(--line);border-radius:14px;cursor:pointer;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;box-shadow:0 8px 20px #0006;transition:transform .18s cubic-bezier(.2,.8,.2,1), border-color .18s, box-shadow .18s;color:var(--fg)}
.tile:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 14px 28px #0009}
.tile .tg{font-size:28px;color:var(--gold);font-family:var(--font-pixel);line-height:1}
.tile .tn{font-family:var(--font-pixel);font-size:17px}
.tile .td{font-size:13px;color:var(--muted)}
.tile.hot{border-color:var(--gold);animation:glow 1.4s ease-in-out infinite alternate}
@keyframes glow{to{background:#2e2a18}}
@keyframes fadeup{from{opacity:0;transform:translate(var(--tx,0),10px)}to{opacity:1;transform:translate(var(--tx,0),0)}}
#app>*{animation:screenin .35s ease-out}
@keyframes screenin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.toast{--tx:-50%}

/* Abenteuer */
.camp{margin-bottom:24px}
.camp-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
.camp-h h2{font-size:26px}
.camp-h p{margin:4px 0 0}
.camp.locked .chapters{opacity:.5}
.lockmsg{font-family:var(--font-pixel);color:var(--muted)}
.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.chap{background:linear-gradient(160deg,#1e252d,#151a20);cursor:pointer;text-align:left;padding:10px 12px 10px 74px;position:relative;min-height:76px;display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:12px}
.chap:hover:not(:disabled){border:1px solid var(--gold);border-radius:12px}
.chap:disabled{cursor:not-allowed}
.chap.locked{opacity:.45}
.chap.done{border:1px solid #4f8a4a;border-radius:12px}
.chap-boss{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:56px;height:52px}
.chn{font-family:var(--font-pixel);font-size:16px}
.chl,.chs{font-size:13px;color:var(--muted)}
.chap.done .chs{color:#8fd38a}
.intro{display:flex;flex-direction:column;gap:6px}
.big{font-size:clamp(26px,6vw,40px)}
.story{font-size:18px;max-width:36em}
.story p{margin:0 0 10px}
.bg-shire{background:linear-gradient(#1c2a1c,#141a14)} .bg-weather{background:linear-gradient(#1a2030,#11141c)} .bg-moria{background:linear-gradient(#1c1210,#0e0a0a)}
.bg-amonhen{background:linear-gradient(#18261c,#0f1712)} .bg-helm{background:linear-gradient(#1c2026,#111316)} .bg-cirith{background:linear-gradient(#1c1224,#0e0a12)}
.bg-pelennor{background:linear-gradient(#2a1a12,#140e0a)} .bg-doom{background:linear-gradient(#2a0e0a,#120606)} .bg-snow{background:linear-gradient(#1e2836,#121820)}
.bg-sea{background:linear-gradient(#142234,#0c1420)} .bg-south{background:linear-gradient(#2a1e12,#16100a)} .bg-rhun{background:linear-gradient(#221a2a,#120e16)}
.bg-khazad{background:linear-gradient(#161c24,#0c1014)} .bg-eregion{background:linear-gradient(#2a1a1a,#140e0e)}

/* Karte */
.partystrip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:16px}
.pm{display:flex;gap:6px;align-items:center;background:var(--panel);padding:6px;min-width:0;border:1px solid var(--line);border-radius:12px}
.pm canvas{width:36px;height:36px;flex:none}
.pm>div{min-width:0;flex:1;font-size:13px}
.pm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--font-pixel);font-weight:500}
.pm.dead{opacity:.45}
.path{display:flex;flex-direction:column;align-items:center}
.prow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.conn{width:4px;height:12px;background:var(--line)}
.node{width:clamp(96px,26vw,150px);background:linear-gradient(160deg,#1e252d,#151a20);color:var(--fg);padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;border:1px solid var(--line);border-radius:12px}
.node .ng{font-size:22px;font-family:var(--font-pixel);color:var(--gold)}
.node .nn{font-family:var(--font-pixel);font-size:15px;text-align:center}
.node .nd{font-size:12px;color:var(--muted);text-align:center}
.node.cur{border:1px solid var(--gold);border-radius:12px;animation:glow 1.2s ease-in-out infinite alternate}
.node.done{border:1px solid #4f8a4a;border-radius:12px;background:#18241a}
.node.skip{opacity:.25} .node.future{opacity:.6;cursor:default} .node:disabled{cursor:default}
.node.n-boss{width:clamp(200px,60vw,300px);background:#2a1410}
.node.n-boss .ng{color:var(--ember)}

/* Kampf */
.bscreen{display:flex;flex-direction:column;min-height:100%;max-width:1100px;margin:0 auto;animation:none}
.bhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px))}
.blabel{font-family:var(--font-pixel);color:var(--gold-2)}
.bctl{display:flex;gap:6px;flex-wrap:wrap}
.stage{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 10px 40px #000a;margin:0 max(8px,env(safe-area-inset-left,0px))}
#bcv{display:block;width:100%;aspect-ratio:16/9}
#banner{position:absolute;left:50%;top:20%;transform:translate(-50%,-6px) scale(.96);font-family:var(--font-pixel);font-weight:700;letter-spacing:.04em;font-size:clamp(14px,3.4vw,26px);color:#fff;text-shadow:0 2px 12px #000,0 0 3px #000;opacity:0;transition:opacity .2s, transform .25s cubic-bezier(.2,.8,.2,1);pointer-events:none;white-space:nowrap;max-width:96%;overflow:hidden;text-overflow:ellipsis}
#banner.show{opacity:1;transform:translate(-50%,0) scale(1)}
#banner.foe{color:#ff9a7e} #banner.ult{color:var(--gold-2);font-size:clamp(18px,4.6vw,36px)}
#bossbar{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:min(60%,420px);text-align:center;font-family:var(--font-pixel);font-size:clamp(11px,2.4vw,15px);text-shadow:1px 1px 0 #000}
.bar.boss{height:8px;border:1px solid var(--line);border-radius:12px}
.bar.boss i{background:linear-gradient(#ff6a4a,#a8201a)}
.hud{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:8px max(12px,env(safe-area-inset-right,0px)) 4px max(12px,env(safe-area-inset-left,0px))}
.hc{background:var(--panel);display:flex;gap:6px;padding:6px;align-items:flex-start;position:relative;min-width:0;border:1px solid var(--line);border-radius:12px}
.hc.act{border:1px solid var(--gold);border-radius:12px}
.hc.dead{opacity:.4;filter:grayscale(1)}
.hc canvas{width:40px;height:40px;flex:none}
.hcb{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.hcb b{font-family:var(--font-pixel);font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc .bar.hp{height:9px}
.hc .bar.hp span{position:absolute;right:3px;top:-2px;font-family:var(--font-pixel);font-size:10px;text-shadow:1px 1px 0 #000}
.hc .bar.rs{height:4px} .hc .bar.en{height:4px} .hc .bar.en i{background:var(--gold)} .hc .bar.en.full i{background:#fff6c0;animation:glow 0.5s infinite alternate}
.hst{display:flex;gap:3px;flex-wrap:wrap;font-family:var(--font-pixel);font-size:9px;min-height:11px}
.ultb{position:absolute;right:4px;bottom:4px;font-family:var(--font-pixel);font-weight:700;font-size:12px;background:linear-gradient(#ffd77a,#b8862e);color:#1a1206;border:1px solid #ffe9a8;border-radius:8px;padding:3px 8px;cursor:pointer;animation:ultpulse .7s infinite alternate}
@keyframes ultpulse{to{box-shadow:0 0 14px #ffd77a}}
.ultb.queued{background:#fff6c0}
.blog{padding:4px max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px));font-size:13px;color:var(--muted);min-height:2.4em}
.blog b.hero{color:#a8d0ff} .blog b.enemy{color:#ff9a7e}

/* Ergebnisse */
.rewards{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--font-pixel);font-size:18px;margin:10px 0 14px;color:var(--gold-2)}
.xprow{display:grid;grid-template-columns:36px 9em 1fr auto;gap:8px;align-items:center;margin:6px 0}
.xprow canvas{width:36px;height:36px}
.xn{font-family:var(--font-pixel)} .xn small{color:var(--muted)}
.up{color:var(--gold-2);font-family:var(--font-pixel)} .cap{color:#ff9a7e;font-size:13px}
.loots{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;margin-top:8px}
.loots.list{grid-template-columns:1fr}
.loot{display:flex;gap:10px;align-items:flex-start;background:var(--panel-2);padding:8px 10px;min-width:0;border:1px solid var(--line);border-left:3px solid var(--rc,#888);border-radius:12px}
.loot.r0{--rc:#b8b8b0} .loot.r1{--rc:#5ecf5a} .loot.r2{--rc:#4f9ae8} .loot.r3{--rc:#b46ae8} .loot.r4{--rc:#f09a2a}
.loot.r4{background:linear-gradient(90deg,#3a2810,var(--panel-2))}
.loot>div{display:flex;flex-direction:column;min-width:0}
.loot b{font-family:var(--font-pixel);font-weight:500}
.loot small{font-size:12.5px}
.loot .leg{color:#f0c070}
.ic{width:42px;height:42px;flex:none;background:radial-gradient(#1e252d,#0a0c0f);border:1px solid var(--rc,#888);border-radius:10px}
.loot.reveal{animation:reveal .5s ease-out both}
.loot.reveal:nth-child(2){animation-delay:.15s}.loot.reveal:nth-child(3){animation-delay:.3s}.loot.reveal:nth-child(4){animation-delay:.45s}
@keyframes reveal{from{transform:scale(.85);filter:brightness(3)}to{transform:none;filter:none}}
.lrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.lact{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;font-family:var(--font-pixel);font-size:13px}
.pos{color:#8fd38a} .neg{color:#e08a7a}
.newheroes{display:flex;gap:16px;flex-wrap:wrap}
.nh{display:flex;flex-direction:column;align-items:center;gap:2px}
.nh canvas{width:112px;height:104px}

/* Gruppe & Helden */
.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:12px 0}
.slot{background:linear-gradient(160deg,#1e252d,#151a20);color:var(--fg);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:150px;justify-content:center;border:1px solid var(--line);border-radius:12px;font-size:13px;cursor:pointer}
.slot.empty{color:var(--muted);font-family:var(--font-pixel);cursor:default;border:1px dashed #3a444e;border-radius:12px}
.slot canvas,.rh canvas.pix{width:84px;height:84px}
.slot b,.rh b{font-family:var(--font-pixel);font-weight:500}
.warn{background:#3a1a14;padding:8px 12px;margin:6px 0;border:1px solid #8a3a2a;border-radius:10px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 10px}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.rh{background:linear-gradient(160deg,#1e252d,#151a20);color:var(--fg);padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;cursor:pointer;border:1px solid var(--line);border-radius:12px;font-size:13px;position:relative}
.rh:hover{border:1px solid var(--gold);border-radius:12px}
.rh.in{border:1px solid var(--gold);border-radius:12px;background:#242014}
.rh small{color:var(--muted)}
.rh.tav{cursor:default}
.rh.small{flex-direction:row;gap:8px}
.rh.small canvas{width:36px;height:36px}
.badge{font-family:var(--font-pixel);font-size:11px;background:#3a4a2a;padding:1px 6px;color:#d8f0b0}
.badge.evo{background:#5a3a10;color:var(--gold-2)}
.givelist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:12px}
.hero-head{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;margin-bottom:12px}
.hero-head canvas.big{width:84px;height:84px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.hero-head h2{font-size:28px} .hero-head h2 small{font-size:16px;color:var(--gold)}
.hero-head p{margin:6px 0 0}
.hmeta{display:flex;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin:4px 0 6px;align-items:center}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.tab{font-family:var(--font-pixel);background:var(--panel);color:var(--fg);padding:8px 14px;cursor:pointer;border:1px solid var(--line);border-radius:12px}
.tab.on{background:#2e2a18;border:1px solid var(--gold);border-radius:12px;color:var(--gold-2)}
.hero-over{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px}
.preview{background:var(--panel);padding:10px;border:1px solid var(--line);border-radius:12px}
.preview canvas{width:100%;aspect-ratio:96/64;display:block;background:radial-gradient(#26303a,#12161a)}
.animbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px;font-size:15px}
.statgrid div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:3px 0}
.statgrid b{font-family:var(--font-pixel);font-weight:500;font-variant-numeric:tabular-nums}
.passives{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.passives span{font-size:12.5px;background:#20302a;padding:2px 7px;color:#b8e8c8}
.tactic{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:10px 0}
.skills{display:grid;gap:8px;margin-top:6px}
.sk{background:var(--panel);padding:8px 12px;border:1px solid var(--line);border-radius:12px}
.sk b{font-family:var(--font-pixel);font-weight:500}
.sk small{display:block;color:var(--muted)}
.sk p{margin:2px 0 0;font-size:14px}
.sk.locked{opacity:.5}
.sk.ult{border:1px solid var(--gold);border-radius:12px}
.gear{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gslot{background:var(--panel);padding:10px;border:1px solid var(--line);border-radius:12px;min-width:0}
.gsh{font-family:var(--font-pixel);color:var(--gold);margin-bottom:6px}
.tpoints{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tpoints b{font-family:var(--font-pixel);font-size:20px;color:var(--gold-2)}
.tree{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.branch{background:var(--panel);padding:10px;display:flex;flex-direction:column;align-items:stretch;border:1px solid var(--line);border-radius:12px}
.branch h3{font-size:17px;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px} .branch h3 small{color:var(--muted);font-size:12px}
.tnode{background:var(--panel-2);padding:8px 10px;text-align:left;display:grid;grid-template-columns:1fr auto;gap:2px 8px;cursor:pointer;border:1px solid var(--line);border-radius:12px}
.tnode b{font-family:var(--font-pixel);font-weight:500}
.tnode .rk{font-family:var(--font-pixel);color:var(--gold-2)}
.tnode small{grid-column:1/-1;color:var(--muted);font-size:12.5px}
.tnode.has{border:1px solid #6a8a3a;border-radius:10px}
.tnode.cap{background:#2a2414}
.tnode.cap.has{border:1px solid var(--gold);border-radius:12px}
.tnode.lock{opacity:.4}
.tnode:not(:disabled):hover{background:#2c3640}
.tnode:disabled{cursor:default}
.tline{width:4px;height:10px;background:var(--line);margin:0 auto}
.evo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.evs{background:var(--panel);padding:10px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;width:200px;border:1px solid var(--line);border-radius:12px}
.evs canvas{width:112px;height:104px}
.evs b{font-family:var(--font-pixel)} .evs small{color:var(--muted);font-size:12.5px}
.evs.cur{border:1px solid var(--gold);border-radius:12px} .evs.past{opacity:.6}
.evarrow{font-size:24px;color:var(--gold)}
.evobox{margin-top:16px;text-align:center}
.achs{display:grid;gap:8px}
.ach{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--panel);padding:10px 14px;border:1px solid var(--line);border-radius:12px}
.ach b{font-family:var(--font-pixel);font-weight:500}
.ach small{display:block;color:var(--muted)}
.ach .bar{margin:4px 0;max-width:260px}
.ach.ready{border:1px solid var(--gold);border-radius:12px} .ach.claimed{opacity:.55}
.ar{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-family:var(--font-pixel)}
.foes{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.foe{display:flex;flex-direction:column;align-items:center}
.foe canvas{width:84px;height:78px}

@media (max-width:760px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero-over{grid-template-columns:1fr}
  .gear,.tree{grid-template-columns:1fr}
  .slots{grid-template-columns:repeat(3,minmax(0,1fr))}
  .partystrip{grid-template-columns:repeat(3,minmax(0,1fr))}
  .xprow{grid-template-columns:36px 1fr;}
  .xprow .bar{grid-column:2}
  .lrow{grid-template-columns:1fr}
}
@media (max-width:560px){
  .hud{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
  .hc{flex-direction:column;align-items:center;padding:4px}
  .hc canvas{width:30px;height:30px}
  .hcb{width:100%}
  .hcb b{font-size:11px;text-align:center}
  .hst{display:none}
  .res{font-size:13px;gap:6px}
  .tb-in .btn.small{padding:4px 6px}
}
@media (prefers-reduced-motion:reduce){.tile.hot,.node.cur,.loot.reveal,.ultb{animation:none}}
</style>

<div id="app"></div>
<div id="modal" hidden></div>
<script src="js/data.js"></script>
<script src="js/render.js"></script>
<script src="js/core.js"></script>
<script src="js/battle.js"></script>
<script src="js/ui.js"></script>
