<title>Ringfahrt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Alegreya:ital,wght@0,400;0,600;1,400&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: one-screen game. Title → Gemeinschaft wählen → Kapitelkarte (Knoten-Reihen) → Kampfbühne (Gegner oben, Helden unten, Befehle am Fuß). Bewusst einheitlich dunkel: Mittelerde bei Nacht. */
:root{
  --ink:#0d1112;       /* Nachtgrund */
  --ink-2:#151b1c;     /* Flächen */
  --ink-3:#1f2828;     /* erhabene Flächen */
  --line:#34413d;      /* Linien */
  --fg:#e7e0cc;        /* Pergamenttext */
  --muted:#98a296;     /* gedämpft */
  --gold:#d6ae57;      /* Ringgold, Akzent */
  --gold-2:#f3d78f;
  --ember:#d2603e;     /* Glut, Gefahr */
  --elf:#93c6c0;       /* Elbensilber */
  --moss:#86a85d;      /* Heilung */
  --hp:#c24a3b; --mp:#4d86bd; --lim:#d6ae57;
  --font-display:'Cinzel', 'Trajan Pro', 'Times New Roman', Georgia, serif;
  --font-body:'Alegreya', Georgia, 'Times New Roman', serif;
  --font-ui:'Alegreya Sans', 'Segoe UI', system-ui, sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.45;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
#app{min-height:100%;display:flex;flex-direction:column}
.wrap{width:100%;max-width:1040px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:.02em}
.eyebrow{font-family:var(--font-ui);text-transform:uppercase;letter-spacing:.16em;font-size:12px;color:var(--gold);font-weight:700}
.muted{color:var(--muted)}
.btn{appearance:none;border:1px solid var(--line);background:var(--ink-3);padding:10px 16px;border-radius:6px;cursor:pointer;font-family:var(--font-ui);font-weight:700;font-size:15px;letter-spacing:.02em;transition:background .15s,border-color .15s,transform .1s;touch-action:manipulation}
.btn:hover:not(:disabled){border-color:var(--gold);background:#273230}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:linear-gradient(#e2bd68,#b98d36);color:#1c1407;border-color:#f0d590}
.btn.primary:hover:not(:disabled){background:linear-gradient(#f0cd7a,#c89a3e)}
.btn.ghost{background:transparent}
.btn.small{padding:6px 10px;font-size:13px}
.row-gap{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- Titel ---------- */
.title-screen{flex:1;display:grid;place-items:center;text-align:center;background:
  radial-gradient(ellipse 80% 60% at 50% 100%, rgba(210,96,62,.18), transparent 70%),
  radial-gradient(ellipse 60% 50% at 50% 0%, rgba(147,198,192,.08), transparent 70%), var(--ink)}
.title-screen .wrap{display:flex;flex-direction:column;align-items:center;gap:18px}
.ring{width:132px;height:132px;border-radius:50%;position:relative;margin-bottom:6px;
  background:conic-gradient(from 0deg,#8a6420,#f6dc95,#a47826,#f9e3a4,#8a6420);
  -webkit-mask:radial-gradient(circle,transparent 52%,#000 53%,#000 66%,transparent 67%);
          mask:radial-gradient(circle,transparent 52%,#000 53%,#000 66%,transparent 67%);
  animation:spin 14s linear infinite;filter:drop-shadow(0 0 18px rgba(214,174,87,.6))}
.ring-glow{position:relative}
.ring-glow::after{content:"";position:absolute;inset:18px;border-radius:50%;box-shadow:0 0 40px 6px rgba(210,96,62,.25);pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.logo{font-size:clamp(44px,11vw,88px);font-weight:900;letter-spacing:.08em;background:linear-gradient(#f8e7b4,#c99a42 60%,#8f6522);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{font-style:italic;color:var(--muted);max-width:34em}
.menu{display:flex;flex-direction:column;gap:10px;width:min(320px,100%)}
.menu .btn{padding:13px 18px;font-size:16px}
.opts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.toggle{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-family:var(--font-ui);font-size:13px;cursor:pointer;color:var(--muted)}
.toggle.on{color:var(--gold-2);border-color:var(--gold)}
.foot{font-size:12px;color:var(--muted);font-family:var(--font-ui);max-width:40em}

/* ---------- Auswahl ---------- */
.select-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:16px}
.hcard{position:relative;border:1px solid var(--line);background:var(--ink-2);border-radius:10px;padding:14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px;transition:border-color .15s, transform .15s}
.hcard:hover{border-color:#5b6a62}
.hcard.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold), 0 0 24px rgba(214,174,87,.18)}
.hcard .top{display:flex;gap:12px;align-items:center}
.hcard .em{font-size:40px;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 40% 35%, var(--c), #0000 75%);flex:none}
.hcard h3{font-size:18px}
.hcard .role{font-family:var(--font-ui);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.stat-lines{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;font-family:var(--font-ui);font-size:12px;align-items:center}
.sbar{height:5px;background:#000a;border-radius:3px;overflow:hidden}
.sbar i{display:block;height:100%;background:var(--elf)}
.hcard .sk{font-size:13px;color:var(--muted)}
.badge-sel{position:absolute;top:10px;right:12px;font-family:var(--font-ui);font-weight:800;color:var(--gold);font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;padding:8px 14px;cursor:pointer;font-family:var(--font-ui);font-weight:700;color:var(--muted)}
.seg button.on{background:var(--ink-3);color:var(--gold-2)}
.bar-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px}

/* ---------- Karte ---------- */
.map-screen{flex:1}
.map-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap}
.map-head h2{font-size:clamp(26px,5vw,38px)}
.purse{font-family:var(--font-ui);display:flex;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.purse b{color:var(--fg)}
.party-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:16px 0}
.pmini{border:1px solid var(--line);background:var(--ink-2);border-radius:8px;padding:8px;display:flex;gap:8px;align-items:center;min-width:0}
.pmini .em{font-size:26px;flex:none}
.pmini .info{min-width:0;flex:1;font-family:var(--font-ui);font-size:12px}
.pmini .info b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.path{display:flex;flex-direction:column;gap:10px;margin-top:8px;position:relative}
.prow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;position:relative}
.prow::before{content:attr(data-step);position:absolute;left:0;top:50%;transform:translateY(-50%);font-family:var(--font-ui);font-size:11px;color:var(--muted);letter-spacing:.14em}
.node{width:clamp(96px,26vw,150px);border:1px solid var(--line);background:var(--ink-2);border-radius:10px;padding:10px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--font-ui)}
.node .gl{font-size:24px;line-height:1.2;font-family:var(--font-display)}
.node .nl{font-weight:800;font-size:14px}
.node .nd{font-size:11px;color:var(--muted)}
.node.cur{border-color:var(--gold);animation:breathe 2.2s ease-in-out infinite}
.node.cur:hover{background:#263129}
.node.done{border-color:var(--moss);background:#1a2419}
.node.skip{opacity:.3}
.node.future{opacity:.55;cursor:default}
.node:disabled{cursor:default}
.node.t-boss{width:clamp(180px,50vw,280px);border-color:#6b2a1c;background:linear-gradient(#2a1611,#170d0b)}
.node.t-boss.cur{border-color:var(--ember)}
@keyframes breathe{50%{box-shadow:0 0 18px rgba(214,174,87,.35)}}
.connector{height:10px;width:2px;background:var(--line);margin:0 auto}

/* ---------- Kampf ---------- */
.battle{flex:1;display:flex;flex-direction:column;position:relative;overflow:hidden;min-height:100%}
.battle::before{content:"";position:absolute;left:0;right:0;bottom:30%;height:38%;background:var(--mount,#0a0e0e);opacity:.9;
  clip-path:polygon(0 100%,0 62%,8% 48%,15% 58%,24% 30%,31% 44%,38% 26%,47% 50%,55% 22%,63% 40%,70% 32%,79% 55%,87% 38%,94% 52%,100% 42%,100% 100%);pointer-events:none}
.battle::after{content:"";position:absolute;inset:auto 0 0 0;height:32%;background:linear-gradient(transparent,rgba(0,0,0,.55));pointer-events:none}
.battle > *{position:relative;z-index:1}
.bg-shire{background:radial-gradient(ellipse 90% 50% at 50% 105%, #3c5a2a 0%, transparent 70%), linear-gradient(#22343a,#121b17 70%);--mount:#16241c}
.bg-weather{background:radial-gradient(ellipse 70% 40% at 50% 0%, #3b4660 0%, transparent 70%), linear-gradient(#1a2130,#0c0f15);--mount:#0f141c}
.bg-moria{background:radial-gradient(ellipse 80% 45% at 50% 108%, #7a2c12 0%, transparent 65%), linear-gradient(#0b0b0c,#100907);--mount:#050505}
.bg-amonhen{background:radial-gradient(ellipse 80% 50% at 50% 0%, #48604a 0%, transparent 70%), linear-gradient(#1b2b22,#0c1410);--mount:#102018}
.bg-helm{background:radial-gradient(ellipse 80% 40% at 30% 0%, #3f4652 0%, transparent 70%), linear-gradient(#1a1d24,#0c0d10);--mount:#121418}
.bg-cirith{background:radial-gradient(ellipse 70% 45% at 50% 0%, #3d2550 0%, transparent 70%), linear-gradient(#150f1a,#09070b);--mount:#0d0911}
.bg-pelennor{background:radial-gradient(ellipse 90% 45% at 50% 105%, #6a3418 0%, transparent 70%), linear-gradient(#2a2220,#110c0a);--mount:#1a1210}
.bg-doom{background:radial-gradient(ellipse 70% 55% at 50% 108%, #a1260e 0%, transparent 65%), linear-gradient(#1c0b08,#0a0505);--mount:#120605}
.bhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px));flex-wrap:wrap}
.bhead .chap{font-family:var(--font-display);font-size:14px;color:var(--gold-2);letter-spacing:.06em}
.tl{display:flex;gap:4px;align-items:center;font-family:var(--font-ui);font-size:11px;color:var(--muted)}
.tl .tlc{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:17px;background:#000a;border:1px solid var(--line);flex:none}
.tl .tlc.h{border-color:#5d7f86}
.tl .tlc.e{border-color:#7a3527}
.tl .tlc.now{border-color:var(--gold);box-shadow:0 0 10px rgba(214,174,87,.6);width:36px;height:36px;font-size:20px}
.side{display:flex;justify-content:center;gap:clamp(5px,2vw,16px);flex-wrap:nowrap;padding:8px max(12px, env(safe-area-inset-left, 0px))}
.side.enemies{padding-top:clamp(10px,4vh,40px)}
.unit{flex:0 1 132px;min-width:0;border:1px solid rgba(255,255,255,.08);background:rgba(10,13,14,.72);backdrop-filter:blur(2px);border-radius:10px;padding:8px 6px 6px;text-align:center;transition:transform .18s ease, opacity .3s, filter .3s;position:relative;font-family:var(--font-ui)}
.unit .face{font-size:clamp(30px,8vw,50px);line-height:1.15;height:1.2em;display:grid;place-items:center;filter:var(--tint,none)}
.unit.boss .face{font-size:clamp(46px,12vw,78px)}
.unit.boss{flex:0 1 200px;border-color:rgba(210,96,62,.5)}
.unit.elite{border-color:rgba(214,174,87,.35)}
.unit .un{font-weight:800;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit .ul{font-size:10px;color:var(--muted);letter-spacing:.06em}
.bar{height:6px;background:#000c;border-radius:3px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;width:100%;transition:width .35s ease}
.bar.hp i{background:linear-gradient(90deg,#a63a2e,#d8604b)}
.bar.hp.low i{background:linear-gradient(90deg,#c22,#f44)}
.bar.mp i{background:linear-gradient(90deg,#335f8c,#5b9bd5)}
.bar.lim{height:4px}
.bar.lim i{background:linear-gradient(90deg,#9c7425,#f0cf7f)}
.bar.lim.full i{animation:limglow .8s ease-in-out infinite alternate}
@keyframes limglow{to{filter:brightness(1.6)}}
.num{font-size:11px;font-variant-numeric:tabular-nums;color:#cfc8b4;display:flex;justify-content:space-between;gap:4px}
.sts{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;min-height:14px;margin-top:3px}
.chip{font-size:9px;font-weight:800;padding:1px 4px;border-radius:3px;letter-spacing:.03em;background:#000a;border:1px solid currentColor;line-height:1.2;font-variant-numeric:tabular-nums}
.unit.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 22px rgba(214,174,87,.35)}
.unit.dead{opacity:.32;filter:grayscale(1)}
.unit.targetable{cursor:pointer;border-color:var(--ember);box-shadow:0 0 0 1px var(--ember),0 0 18px rgba(210,96,62,.45);animation:tpulse 1s ease-in-out infinite}
.unit.targetable.ally{border-color:var(--moss);box-shadow:0 0 0 1px var(--moss),0 0 18px rgba(134,168,93,.45)}
@keyframes tpulse{50%{transform:translateY(-3px)}}
.unit.lunge-up{transform:translateY(-22px) scale(1.05)}
.unit.lunge-down{transform:translateY(22px) scale(1.05)}
.unit.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.unit.flash .face{animation:flash .3s}
@keyframes flash{50%{filter:brightness(3) saturate(0)}}
.unit.invis .face{opacity:.25}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;min-height:70px;padding:4px 16px}
#banner{font-family:var(--font-display);font-size:clamp(16px,4vw,22px);color:var(--gold-2);text-shadow:0 2px 10px #000;min-height:1.4em;text-align:center;transition:opacity .2s}
#banner.foe{color:#f19a7e}
#blog{font-size:13px;color:#cfc8b4;text-align:center;max-width:36em;min-height:3.6em;font-family:var(--font-body)}
#blog div{opacity:.55}
#blog div:last-child{opacity:1}
.cmd{background:linear-gradient(rgba(8,10,11,.88),rgba(8,10,11,.98));border-top:1px solid var(--line);padding:10px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));min-height:132px}
.cmd .who{font-family:var(--font-ui);font-size:13px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cmd .who b{color:var(--gold-2);font-family:var(--font-display);font-size:15px}
.cmdgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;max-width:1040px;margin:0 auto}
.cbtn{appearance:none;text-align:left;border:1px solid var(--line);background:var(--ink-3);border-radius:7px;padding:7px 10px;cursor:pointer;display:flex;flex-direction:column;gap:1px;font-family:var(--font-ui);min-width:0;touch-action:manipulation}
.cbtn:hover:not(:disabled){border-color:var(--gold)}
.cbtn:focus-visible{outline:2px solid var(--gold-2)}
.cbtn:disabled{opacity:.38;cursor:not-allowed}
.cbtn .cn{font-weight:800;font-size:14px;display:flex;justify-content:space-between;gap:6px}
.cbtn .cn small{font-weight:700;color:#86b2e0;font-variant-numeric:tabular-nums}
.cbtn .cd{font-size:11px;color:var(--muted);line-height:1.25}
.cbtn.ult{border-color:var(--gold);background:linear-gradient(#3a2e14,#231c0d)}
.cbtn.ult:not(:disabled){animation:breathe 1.4s ease-in-out infinite}
.cbtn.alt{background:transparent}
.cmd .inner{max-width:1040px;margin:0 auto}

/* ---------- QTE ---------- */
#qte{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:radial-gradient(circle at 50% 50%, rgba(5,7,8,.72) 0, rgba(5,7,8,.6) 160px, rgba(0,0,0,.45) 100%);touch-action:manipulation;cursor:pointer;user-select:none;-webkit-user-select:none}
.qbox{position:relative;width:240px;height:240px;display:grid;place-items:center}
.qtarget,.qring{position:absolute;width:96px;height:96px;border-radius:50%;left:50%;top:50%;margin:-48px 0 0 -48px}
.qtarget{border:4px solid var(--gold);box-shadow:0 0 24px rgba(214,174,87,.6), inset 0 0 18px rgba(214,174,87,.35)}
#qte.def .qtarget{border-color:var(--elf);box-shadow:0 0 24px rgba(147,198,192,.6), inset 0 0 18px rgba(147,198,192,.3)}
.qring{border:3px solid #fff;will-change:transform}
.qlabel{position:absolute;top:-34px;left:-60px;right:-60px;text-align:center;font-family:var(--font-display);font-size:20px;color:var(--gold-2);text-shadow:0 2px 8px #000}
#qte.def .qlabel{color:#bfe6e1}
.qhint{position:absolute;bottom:-6px;left:-60px;right:-60px;text-align:center;font-family:var(--font-ui);font-size:12px;color:#d8d2c0;opacity:.85}
.qres{position:absolute;font-family:var(--font-display);font-weight:900;font-size:30px;text-shadow:0 2px 10px #000;opacity:0}
.qres.show{animation:pop .4s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:scale(.6)}40%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}

/* ---------- FX ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
.float{position:fixed;transform:translate(-50%,0);font-family:var(--font-display);font-weight:900;font-size:22px;text-shadow:0 2px 0 #000,0 0 10px #000;animation:floatUp 1s ease-out forwards;white-space:nowrap}
.float.crit{font-size:30px;color:#ffd36b}
.float.heal{color:#9fe07a}
.float.miss{color:#bbb;font-size:16px}
.float.parry{color:#bfe6e1}
.float.buff{color:#f3d78f;font-size:15px}
.float.debuff{color:#e58c6c;font-size:15px}
.float.dmg{color:#fff}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,8px) scale(.8)}15%{opacity:1;transform:translate(-50%,-6px) scale(1.12)}100%{opacity:0;transform:translate(-50%,-46px) scale(1)}}
.ultflash{position:fixed;inset:0;display:grid;place-items:center;z-index:65;pointer-events:none;background:radial-gradient(circle, rgba(214,174,87,.28), rgba(0,0,0,.6));animation:ultf 1.1s ease-out forwards}
.ultflash span{font-family:var(--font-display);font-weight:900;font-size:clamp(26px,7vw,54px);color:var(--gold-2);text-shadow:0 0 24px rgba(214,174,87,.8);text-align:center;padding:0 16px}
@keyframes ultf{0%{opacity:0}15%{opacity:1}80%{opacity:1}100%{opacity:0}}

/* ---------- Panels ---------- */
.panel{border:1px solid var(--line);background:var(--ink-2);border-radius:12px;padding:18px}
.center-screen{flex:1;display:grid;place-items:center}
.story{max-width:38em;font-size:18px;line-height:1.6}
.story p{margin:0 0 12px}
.big-num{font-family:var(--font-display);font-size:13px;letter-spacing:.3em;color:var(--gold)}
.reward-list{display:grid;gap:8px;margin:14px 0}
.rl{display:flex;gap:10px;align-items:center;font-family:var(--font-ui)}
.rl .em{font-size:24px;width:32px;text-align:center}
.rl .xpb{flex:1;max-width:220px}
.lvlup{color:var(--gold-2);font-weight:800}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:14px}
.shop-item{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--ink-3);display:flex;flex-direction:column;gap:6px}
.shop-item h3{font-size:16px}
.shop-item p{margin:0;font-size:14px;color:var(--muted);flex:1}
.price{font-family:var(--font-ui);font-weight:800;color:var(--gold-2);font-variant-numeric:tabular-nums}
#modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:16px}
#modal .mbox{max-width:760px;width:100%;max-height:calc(100% - 32px);overflow:auto;background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:20px}
.help h3{font-size:16px;margin:14px 0 4px;color:var(--gold-2)}
.help p,.help li{font-size:15px}
.help ul{padding-left:20px;margin:4px 0}
.hero-detail{display:grid;grid-template-columns:auto 1fr;gap:12px;border-top:1px solid var(--line);padding:12px 0}
.hero-detail .em{font-size:42px}
.kv{font-family:var(--font-ui);font-size:13px;display:flex;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.kv span b{color:var(--fg)}
.sklist{font-size:13px;color:var(--muted);margin-top:4px}
.sklist b{color:var(--fg)}
.sklist .locked{opacity:.5}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink-3);border:1px solid var(--gold);padding:8px 14px;border-radius:8px;z-index:90;font-family:var(--font-ui);font-size:14px}

@media (max-width:560px){
  .party-strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cmdgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cbtn .cd{display:none}
  .prow::before{display:none}
  .tl .tlc{width:24px;height:24px;font-size:13px}
  .tl .tlc.now{width:30px;height:30px;font-size:17px}
  .tl .lbl{display:none}
  .unit{padding:6px 4px 4px}
  .cmd{min-height:110px}
}
@media (prefers-reduced-motion:reduce){
  .ring,.node.cur,.cbtn.ult,.unit.targetable,.bar.lim.full i{animation:none}
}

/* ---------------- Audio ---------------- */
let AC=null;
function ac(){ if(!SET.sound) return null; if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null} } if(AC.state==='suspended') AC.resume(); return AC; }
function tone(f,d=.1,type='square',vol=.05,slide=0,delay=0){ const a=ac(); if(!a) return; const t=a.currentTime+delay; const o=a.createOscillator(), g=a.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g).connect(a.destination); o.start(t); o.stop(t+d+.02); }
function noise(d=.1,vol=.08,freq=900){ const a=ac(); if(!a) return; const len=Math.floor(a.sampleRate*d); const b=a.createBuffer(1,len,a.sampleRate); const ch=b.getChannelData(0); for(let i=0;i<len;i++) ch[i]=(Math.random()*2-1)*(1-i/len); const s=a.createBufferSource(); s.buffer=b; const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=freq; const g=a.createGain(); g.gain.value=vol; s.connect(f).connect(g).connect(a.destination); s.start(); }

  level(){[523,659,784,1046].forEach((f,i)=>tone(f,.2,'triangle',.06,0,i*.1))},

  lose(){[392,349,311,262].forEach((f,i)=>tone(f,.35,'sine',.06,0,i*.2))}
};

function xpNeed(l){ return Math.round(25 + l*22 + l*l*1.5); }
function heroStats(h){
  const b=HEROES[h.key], m=1+.12*(h.lvl-1), w=1+.08*(h.wpn||0), r=1+.08*(h.arm||0);
  return {maxHp:Math.round(b.hp*m*r), maxMp:Math.round(b.mp*(1+.06*(h.lvl-1))), atk:Math.round(b.atk*m*w), mag:Math.round(b.mag*m*w), def:Math.round(b.def*m*r), res:Math.round(b.res*m*r), spd:b.spd, crit:b.crit};
}
function newHero(k){ const h={key:k,lvl:1,xp:0,limit:0,wpn:0,arm:0,corruption:0}; const st=heroStats(h); h.hp=st.maxHp; h.mp=st.maxMp; return h; }
function heroSkills(h){ const b=HEROES[h.key]; return b.sk.map(id=>SKILLS[id]).filter(s=>s.lvl<=h.lvl); }
function save(){ if(S) store.set(SAVE_KEY, S); }
function snapshot(){ const c=JSON.parse(JSON.stringify(S)); delete c.snap; S.snap=c; }

    // Gefährten zum Kapitelstart vollständig erholt
    S.party.forEach(h=>{ const st=heroStats(h); h.hp=Math.max(h.hp, Math.round(st.maxHp*.6)); h.mp=Math.max(h.mp, Math.round(st.maxMp*.6)); if(h.hp<=0) h.hp=Math.round(st.maxHp*.6); });
    S.map=genMap(); S.pending=null; snapshot(); save(); mapScreen(); };
}
function genMap(){
  const rows=[]; const W={battle:44,elite:14,event:22,rest:10,shop:10};
  for(let r=0;r<4;r++){
    const n= r===0?2:ri(2,3); const set=new Set();
    if(r===3) set.add('rest');
    let guard=0;
    while(set.size<n && guard++<50){
      let tot=0; const pool=Object.entries(W).filter(([k])=>!(r===0&&(k==='elite'||k==='shop'||k==='rest')));
      pool.forEach(([,w])=>tot+=w); let x=Math.random()*tot; let t='battle';
      for(const [k,w] of pool){ x-=w; if(x<=0){t=k;break;} }
      set.add(t);
    }
    if(r===0) set.add('battle');
    rows.push([...set].slice(0,3));
  }
  rows.push(['boss']);
  return {rows,cur:0,picks:[]};
}

  const bossMul = (kind==='boss' && !d.boss) ? 1.25 : 1;

function startBattle(group, lvl, kind){

function updateTimeline(){

/* Status */
function hasS(u,id){ return u.statuses.find(s=>s.id===id); }
function addS(u,id,dur,val){
  if(!alive(u)) return;
  if(id==='stun' && u.boss){ if(Math.random()<.5){ floatText(u,'widersteht','miss'); return; } }
  const ex=hasS(u,id);
  if(ex){ ex.dur=Math.max(ex.dur,dur); if(val) ex.val=Math.max(ex.val||0,val); }
  else u.statuses.push({id,dur,val});
  floatText(u,STATUS[id].n, STATUS[id].bad?'debuff':'buff');
}
function rmS(u,id){ u.statuses=u.statuses.filter(s=>s.id!==id); }
function cleanse(u){ u.statuses=u.statuses.filter(s=>!STATUS[s.id].bad); }
function eff(u,stat){
  let v=u[stat];
  if(stat==='atk'||stat==='mag'){ if(hasS(u,'atkUp')) v*=1.3; if(hasS(u,'atkDown')) v*=.75; if(hasS(u,'enrage')) v*=1.25; }
  if(stat==='def'||stat==='res'){ if(hasS(u,'defUp')) v*=1.5; if(hasS(u,'defDown')) v*=.65; }
  if(stat==='spd'){ if(hasS(u,'haste')) v*=1.35; if(hasS(u,'slow')) v*=.7; }
  return v;
}
function gainLimit(u,n){ if(u.side!=='hero'||!alive(u)) return; u.limit=clamp(Math.round(u.limit+n),0,100); }

/* Schaden & Heilung */
function skKind(a,sk){ return sk.kind==='auto' ? (a.atkStat==='mag'?'mag':'phys') : sk.kind; }
function calcDmg(a,t,sk,mult){
  const kind=skKind(a,sk), A=eff(a, kind==='mag'?'mag':'atk'), D=eff(t, kind==='mag'?'res':'def');
  let d=(sk.pow||1)*A*60/(60+D);
  if(sk.bonusTag && t.tags.includes(sk.bonusTag)) d*=1.35;
  if(sk.bossBonus && t.boss) d*=sk.bossBonus;
  if(sk.lowHpBonus) d*=1+(1-a.hp/a.maxHp);
  if(hasS(t,'mark')) d*=1.3;
  if(a.side==='enemy') d*=DIFF[S.diff].dmg;
  d*=mult*rnd(.92,1.08);
  const crit = !!sk.alwaysCrit || Math.random() < (a.crit+(sk.critB||0)+(mult>=1.5?.1:0));
  if(crit) d*=1.6;
  return {dmg:Math.max(1,Math.round(d)),crit};
}
function applyDamage(t,dmg,crit){
  const sh=hasS(t,'shield');
  if(sh){ const ab=Math.min(sh.val,dmg); sh.val-=ab; dmg-=ab; if(sh.val<=0) rmS(t,'shield'); if(ab>0 && dmg===0){ floatText(t,'Schild','parry'); updateUnit(t); return 0; } }
  t.hp=Math.max(0,t.hp-dmg);
  floatText(t,(crit?'KRIT! ':'')+dmg, crit?'crit':'dmg');
  anim(t,'shake',360); anim(t,'flash',300); sfx(crit?'crit':'hit');
  if(t.side==='hero') gainLimit(t, dmg/t.maxHp*60);
  if(t.hp<=0) die(t);
  updateUnit(t);
  return dmg;
}
function die(u){
  u.statuses=[]; sfx('die');
  log(u.side==='hero'?`<b>${u.name}</b> ist gefallen!`:`${u.name} wurde besiegt.`);
}
function heal(u,amt){
  if(!alive(u)) return 0;
  amt=Math.round(amt); const before=u.hp; u.hp=Math.min(u.maxHp,u.hp+amt);
  const got=u.hp-before; floatText(u,'+'+got,'heal'); updateUnit(u); return got;
}
function revive(u,pct){ if(alive(u)) return; u.hp=Math.max(1,Math.round(u.maxHp*pct)); u.statuses=[]; floatText(u,'Belebt!','heal'); u.next=Math.max(u.next, B.now||0)+(100/u.spd)*.5; updateUnit(u); }

/* ---------------- Timing (QTE) ---------------- */
let qteHit=null;
const ATK_MULT={perfect:1.5,good:1.15,miss:.85};
const HEAL_MULT={perfect:1.4,good:1.15,miss:.9};
function qte(mode,label,dur){
  if(SET.auto){ return Promise.resolve(mode==='def' ? (Math.random()<.5?'good':'miss') : 'good'); }
  return new Promise(res=>{
    const ov=$('#qte'), ring=$('#qring'), out=$('#qres');
    ov.className = mode; ov.hidden=false; $('#qlabel').textContent=label;
    $('#qhint').textContent = mode==='def' ? 'Tippen oder Leertaste zum Parieren' : 'Tippen oder Leertaste, wenn sich die Ringe decken';
    out.className='qres'; out.textContent='';
    const W=DIFF[S.diff].win; const start=performance.now(); let done=false, raf;
    const D=dur;
    function finish(r){
      if(done) return; done=true; qteHit=null; cancelAnimationFrame(raf);
      const txt={perfect: mode==='def'?'PARADE!':'PERFEKT!', good: mode==='def'?'BLOCK':'GUT', miss: mode==='def'?'GETROFFEN':'DANEBEN'}[r];
      const col={perfect:'#ffe08a',good:'#bfe6e1',miss:'#e88'}[r];
      out.textContent=txt; out.style.color=col; out.className='qres show';
      if(r==='perfect'){ sfx(mode==='def'?'parry':'perfect'); S.stats[mode==='def'?'parry':'perfect']++; } else if(r==='good') sfx('good'); else sfx('miss');
      setTimeout(()=>{ ov.hidden=true; res(r); }, 360);
    }
    qteHit=()=>{ const t=performance.now()-start, d=Math.abs(t-D); finish(d<=W.p?'perfect':d<=W.g?'good':'miss'); };
    function frame(now){
      const t=now-start, p=t/D, sc=2.9-1.9*p;
      ring.style.transform=`scale(${Math.max(.15,sc)})`;
      ring.style.borderColor = Math.abs(t-D)<=W.g ? '#fff6d0' : '#ffffff';
      ring.style.opacity = sc<.6 ? Math.max(0,sc/.6) : 1;
      if(t>D+W.g+90) finish('miss'); else raf=requestAnimationFrame(frame);
    }
    raf=requestAnimationFrame(frame);
  });
}
document.addEventListener('keydown',e=>{
  if(qteHit && (e.code==='Space'||e.code==='Enter'||e.code==='KeyF')){ e.preventDefault(); qteHit(); return; }
  if(!$('#modal').hidden && e.key==='Escape'){ closeModal(); return; }
  // Kampfbefehle per Zifferntaste
  if(/^[1-9]$/.test(e.key)){ const btns=[...document.querySelectorAll('#cmd .cbtn:not(:disabled)')]; const b=btns[+e.key-1]; if(b){ e.preventDefault(); b.click(); } }
  if(e.key==='Escape'){ const c=document.querySelector('#cmd [data-cancel]'); if(c) c.click(); }
});
$('#qte').addEventListener('pointerdown',e=>{ e.preventDefault(); if(qteHit) qteHit(); });

/* ---------------- Kampfablauf ---------------- */
function checkEnd(){
  if(B.enemies.every(u=>!alive(u))) return 'win';
  if(B.heroes.every(u=>!alive(u))) return 'lose';
  return null;
}
async function battleLoop(){
  while(true){
    const end=checkEnd(); if(end){ await sleep(500); return endBattle(end); }
    const all=[...B.heroes,...B.enemies].filter(alive);
    all.sort((a,b)=>a.next-b.next);
    const u=all[0]; B.now=u.next; B.active=u;
    document.querySelectorAll('.unit.active').forEach(e=>e.classList.remove('active'));
    card(u)?.classList.add('active'); updateTimeline();
    const stunned=await startTurn(u);
    if(!alive(u)){ updateAll(); continue; }
    if(checkEnd()) continue;
    if(stunned){ log(`${u.name} ist betäubt und setzt aus.`); floatText(u,'betäubt','miss'); await sleep(650); u.next+=100/eff(u,'spd'); updateAll(); continue; }
    if(u.side==='hero') await heroTurn(u); else await enemyTurn(u);
    card(u)?.classList.remove('active');
    updateAll();
    await sleep(260);
  }
}
async function startTurn(u){
  let ticked=false;
  for(const s of [...u.statuses]){
    const pct={bleed:.05,burn:.06,poison:.07}[s.id];
    if(pct){ const dmg=Math.max(1,Math.round(u.maxHp*pct*(u.boss?.5:1))); u.hp=Math.max(0,u.hp-dmg); floatText(u,dmg,'debuff'); ticked=true; if(u.hp<=0){ die(u); updateUnit(u); return false; } }
    if(s.id==='regen'){ heal(u,u.maxHp*.08); ticked=true; }
  }
  const stunned=!!hasS(u,'stun');
  u.statuses.forEach(s=>{ if(s.dur<90) s.dur--; });
  u.statuses=u.statuses.filter(s=>s.dur>0);
  for(const k in u.cds) if(u.cds[k]>0) u.cds[k]--;
  updateUnit(u);
  if(ticked) await sleep(450);
  return stunned;
}

/* Befehle der Helden */

        <button class="cbtn" data-a="attack"><span class="cn">${b.atkName}<small>+4 MP</small></span><span class="cd">Grundangriff (100 %)</span></button>
        ${skills.map(s=>`<button class="cbtn" data-a="${s.id}" ${h.mp<s.cost?'disabled':''}><span class="cn">${s.n}<small>${s.cost} MP</small></span><span class="cd">${s.d}</span></button>`).join('')}
        <button class="cbtn ult" data-a="${ult.id}" ${h.limit>=100?'':'disabled'}><span class="cn">${ult.n}<small>${h.limit}%</small></span><span class="cd">Ultimate: ${ult.d}</span></button>
        <button class="cbtn alt" data-a="items"><span class="cn">Vorräte</span><span class="cd">Gegenstand benutzen</span></button>
        <button class="cbtn alt" data-a="defend"><span class="cn">Verteidigen</span><span class="cd">Wacht (1), +12 % MP, +10 Ultimate, schneller dran</span></button>
      </div></div>`;
      cmd.querySelectorAll('.cbtn').forEach(btn=>btn.onclick=()=>{ sfx('click'); const a=btn.dataset.a;
        if(a==='defend') return act({type:'defend'});
        if(a==='items') return showItems();
        act({type:'skill',sk:SKILLS[a]});
      });
    };
    const showItems=()=>{
      const cmd=$('#cmd');
      cmd.innerHTML=`<div class="inner"><div class="who"><span><b>${h.name}</b> · Vorräte</span></div><div class="cmdgrid">
        ${Object.entries(ITEMS).map(([k,it])=>`<button class="cbtn" data-i="${k}" ${(S.items[k]||0)>0?'':'disabled'}><span class="cn">${it.n}<small>×${S.items[k]||0}</small></span><span class="cd">${it.d}</span></button>`).join('')}
        <button class="cbtn alt" data-cancel="1"><span class="cn">Zurück</span></button></div></div>`;
      cmd.querySelectorAll('[data-i]').forEach(btn=>btn.onclick=()=>{ sfx('click'); act({type:'item',id:btn.dataset.i}); });
      cmd.querySelector('[data-cancel]').onclick=showMain;
    };
    const act=async c=>{
      if(c.type==='defend'){
        $('#cmd').innerHTML='';
        addS(h,'defUp',1); h.mp=Math.min(h.maxMp,h.mp+Math.round(h.maxMp*.12)); gainLimit(h,10);
        log(`${h.name} geht in Verteidigung.`); sfx('buff'); h.next+=100/eff(h,'spd')*.6; updateUnit(h); await sleep(400); return resolve();
      }
      if(c.type==='skill'){
        const sk=c.sk; let target=null;
        if(sk.tgt==='enemy'){ target=await chooseTarget(B.enemies.filter(alive),sk.n,'enemy'); if(!target) return showMain(); }
        if(sk.tgt==='ally'){ target=await chooseTarget(B.heroes.filter(alive),sk.n,'ally'); if(!target) return showMain(); }
        $('#cmd').innerHTML='';
        await execSkill(h,sk,target); return resolve();
      }
      if(c.type==='item'){
        const it=ITEMS[c.id]; let target=null;
        if(it.tgt==='ally'){ target=await chooseTarget(B.heroes.filter(alive),it.n,'ally'); if(!target) return showItems(); }
        if(it.tgt==='anyAlly'){ target=await chooseTarget(B.heroes,it.n,'ally'); if(!target) return showItems(); }
        $('#cmd').innerHTML='';
        await useItem(h,c.id,target); return resolve();
      }
    };
    showMain();
  });
}
function chooseTarget(list,label,kind){
  return new Promise(res=>{
    if(kind==='enemy' && list.length===1) return res(list[0]);
    const cmd=$('#cmd');
    cmd.innerHTML=`<div class="inner"><div class="who"><span><b>${esc(label)}</b> · Ziel wählen</span></div><div class="cmdgrid">
      ${list.map((u,i)=>`<button class="cbtn" data-t="${u.uid}"><span class="cn">${u.icon} ${esc(u.name)}<small>${u.hp}/${u.maxHp}</small></span></button>`).join('')}
      <button class="cbtn alt" data-cancel="1"><span class="cn">Zurück</span></button></div></div>`;
    const cleanup=()=>{ list.forEach(u=>{ const el=card(u); if(el){ el.classList.remove('targetable','ally'); el.onclick=null; } }); };
    const choose=u=>{ cleanup(); sfx('click'); res(u); };
    list.forEach(u=>{ const el=card(u); if(!el) return; el.classList.add('targetable'); if(kind==='ally') el.classList.add('ally'); el.onclick=()=>choose(u); });
    cmd.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>choose(list.find(u=>u.uid===+b.dataset.t)));
    cmd.querySelector('[data-cancel]').onclick=()=>{ cleanup(); res(null); };
  });
}
async function useItem(h,id,target){
  S.items[id]--; const it=ITEMS[id];
  banner(`${h.name}: ${it.n}`); log(`${h.name} benutzt ${it.n}.`);
  await sleep(250);
  if(id==='lembas'){ heal(target,target.maxHp*.5); sfx('heal'); }
  if(id==='miruvor'){ target.mp=Math.min(target.maxMp,target.mp+Math.round(target.maxMp*.5)); gainLimit(target,25); floatText(target,'+MP','buff'); sfx('heal'); }
  if(id==='athelas'){ if(!alive(target)) revive(target,.4); else { heal(target,target.maxHp*.3); cleanse(target); } sfx('heal'); }
  if(id==='entwasser'){ B.heroes.filter(alive).forEach(u=>{ addS(u,'atkUp',3); addS(u,'defUp',3); }); sfx('buff'); }
  if(id==='sternenglas'){
    sfx('ult'); const lv=Math.round(S.party.reduce((a,h)=>a+h.lvl,0)/S.party.length);
    for(const e of B.enemies.filter(alive)){ const d=Math.round((34+lv*11)*(e.boss?.7:1)*rnd(.9,1.1)); applyDamage(e,d,false); if(alive(e)) addS(e,'atkDown',2); }
  }
  h.next+=100/eff(h,'spd')*.8;
  updateAll(); await sleep(450);
}

/* Fähigkeit ausführen (Helden & Gegner) */
async function execSkill(a,sk,target){
  const foes=a.side==='hero'?B.enemies:B.heroes, friends=a.side==='hero'?B.heroes:B.enemies;
  if(sk.ult) a.limit=0; else a.mp-=sk.cost||0;
  if(sk.cd) a.cds[sk.id]=sk.cd;
  const name = sk.id==='attack' ? a.atkName : sk.n;
  banner(`${a.name}: ${name}`, a.side==='enemy');
  if(sk.ult){ sfx('ult'); const f=document.createElement('div'); f.className='ultflash'; f.innerHTML=`<span>${esc(sk.n)}</span>`; document.body.appendChild(f); await sleep(950); f.remove(); }
  const kind=skKind(a,sk); const hit=new Set(); const counters=[];
  updateUnit(a);

  if(kind==='phys'||kind==='mag'){
    anim(a, a.side==='hero'?'lunge-up':'lunge-down', 320);
    const hits=sk.hits||1;
    await sleep(a.side==='hero'?120:380);
    for(let i=0;i<hits;i++){
      let tg;
      if(sk.tgt==='enemies') tg=foes.filter(alive);
      else if(sk.tgt==='randomEnemies'){ const l=foes.filter(alive); tg=l.length?[pick(l)]:[]; }
      else { if(!alive(target)){ const l=foes.filter(x=>alive(x)&&!(a.side==='enemy'&&hasS(x,'invis'))); if(!l.length) break; target=pick(l); } tg=[target]; }
      if(!tg.length) break;
      let mult=1, defR=null;
      if(a.side==='hero'){
        const r=await qte('atk', hits>1?`${name} · ${i+1}/${hits}`:name, i===0?780:560);
        mult=ATK_MULT[r]; if(r==='perfect') gainLimit(a,5);
      } else {
        const vis=tg.filter(t=>!hasS(t,'invis'));
        tg.filter(t=>hasS(t,'invis')).forEach(t=>floatText(t,'verfehlt','miss'));
        if(!vis.length){ await sleep(300); continue; }
        tg=vis;
        defR=await qte('def', tg.length>1?`${a.name}: ${name} – Ausweichen!`:`${a.name} greift ${tg[0].name} an – Parieren!`, rnd(650,1100));
      }
      for(const t of tg){
        if(!alive(t)) continue;
        let m=mult;
        if(defR==='perfect'){ floatText(t,'Parade!','parry'); gainLimit(t,8); if(tg.length===1) counters.push(t); continue; }
        if(defR==='good') m*=.5;
        const {dmg,crit}=calcDmg(a,t,sk,m);
        applyDamage(t,dmg,crit); hit.add(t);
        if(a.side==='hero') gainLimit(a,4);
        if(a.side==='enemy' && tg.length===1 && hasS(t,'counter') && alive(t) && !counters.includes(t)) counters.push(t);
      }
      updateAll();
      await sleep(hits>1?200:300);
    }
    if(sk.mpGain){ a.mp=Math.min(a.maxMp,a.mp+sk.mpGain); }
  }
  else if(kind==='heal'){
    const tg = sk.tgt==='ally'?[target]:friends.filter(alive);
    let mult=1;
    if(a.side==='hero'){ const r=await qte('atk',name,760); mult=HEAL_MULT[r]; }
    sfx('heal');
    for(const t of tg){ const amt = sk.healPct ? t.maxHp*sk.healPct : sk.pow*eff(a,'mag')*1.25; heal(t,amt*mult); if(sk.cleanse) cleanse(t); hit.add(t); }
  }
  else if(kind==='buff'){ sfx('buff'); await sleep(200); }
  else if(kind==='revive'){
    sfx('heal'); friends.forEach(t=>{ if(!alive(t)) revive(t,.5); else heal(t,t.maxHp*.4); });
  }
  else if(kind==='summon'){
    const n=ENEMIES[sk.summon].n;
    const u=enemyUnit(sk.summon, Math.max(1,a.lvl-1), 'normal'); u.next=(B.now||0)+100/u.spd;
    B.enemies.push(u); addCard(u); updateUnit(u);
    log(`${a.name} ruft Verstärkung: ${n}!`); sfx('buff'); await sleep(400);
  }

  // Effekte
  if(sk.eff) for(const e of sk.eff){
    let on = e.on || 'target';
    let list = on==='self'?[a] : on==='allies'?friends.filter(alive) : (kind==='buff'? (target?[target]:[a]) : [...hit]);
    if(on==='target' && kind==='heal') list=[...hit];
    for(const t of list){
      if(!alive(t)) continue;
      if(Math.random() > (e.ch??1)) continue;
      if(e.s==='healPct'){ heal(t,t.maxHp*e.v); continue; }
      if(e.s==='mp'){ t.mp=Math.min(t.maxMp,t.mp+e.v); continue; }
      if(e.s==='randomDebuff'){ addS(t,pick(['atkDown','defDown','slow','bleed','poison']),e.dur); continue; }
      let val; if(e.s==='shield') val=Math.round(eff(a,e.valStat||'mag')*(e.val||1.5));
      addS(t,e.s,e.dur,val);
    }
  }
  if(sk.corrupt && a.ref){
    a.ref.corruption=(a.ref.corruption||0)+sk.corrupt;
    if(a.ref.corruption>=100){ a.ref.corruption=0; await sleep(300); log(`Die Last des Rings überwältigt ${a.name}!`); addS(a,'stun',1); }
    else log(`Die Last des Rings wächst (${a.ref.corruption}/100).`);
  }
  // Konter
  for(const c of counters){
    if(!alive(c)||!alive(a)) continue;
    await sleep(250); anim(c, c.side==='hero'?'lunge-up':'lunge-down', 300);
    banner(`${c.name}: Konter!`); const {dmg,crit}=calcDmg(c,a,{pow:.8,kind:'auto'},1); applyDamage(a,dmg,crit);
  }
  if(a.side==='hero') { a.ref.limit=a.limit; }
  a.next += 100/eff(a,'spd')*(sk.delay||1);
  updateAll();
  await sleep(250);
}

/* KI der Gegner */
function wpick(list,wf){ let tot=0; list.forEach(x=>tot+=wf(x)); let r=Math.random()*tot; for(const x of list){ r-=wf(x); if(r<=0) return x; } return list[list.length-1]; }
async function enemyTurn(e){
  const d=ENEMIES[e.key];
  if(e.boss && !e.enraged && e.hp<e.maxHp*.5){ e.enraged=true; addS(e,'enrage',99); banner(`${e.name} gerät in Raserei!`,true); log(`${e.name} gerät in Raserei!`); sfx('crit'); await sleep(700); }
  const living=B.enemies.filter(alive);
  let opts=d.sk.map(id=>ESKILLS[id]).filter(sk=>!(e.cds[sk.id]>0)).filter(sk=>{
    if(sk.kind==='summon') return living.length<4;
    if(sk.kind==='buff'){ const s0=sk.eff[0].s; return sk.tgt==='self' ? !hasS(e,s0) : !living.every(x=>hasS(x,s0)); }
    return true;
  });
  if(!opts.length) opts=[ESKILLS.e_slash];
  const sk=wpick(opts,s=>s.w||1);
  let target=null;
  if(sk.tgt==='enemy'){
    const cand=B.heroes.filter(h=>alive(h)&&!hasS(h,'invis'));
    if(!cand.length){ banner(`${e.name} sucht vergeblich …`,true); log(`${e.name} findet kein Ziel.`); await sleep(600); e.next+=100/eff(e,'spd'); return; }
    const taunt=cand.filter(h=>hasS(h,'taunt'));
    target = taunt.length ? pick(taunt) : wpick(cand,h=>1+(1-h.hp/h.maxHp)*1.5);
  }
  banner(`${e.name}: ${sk.n}`,true);
  await sleep(420);
  await execSkill(e,sk,target);
}

/* Kampfende */
function syncHeroes(){
  B.heroes.forEach(u=>{ const h=u.ref; h.hp=u.hp; h.mp=u.mp; h.limit=u.limit; });
}
function endBattle(res){
  $('#cmd') && ($('#cmd').innerHTML='');
  syncHeroes(); S.stats.battles++;
  if(res==='lose'){ sfx('lose'); return gameOver(); }
  sfx('win');
  const xp=B.enemies.reduce((a,e)=>a+e.xp,0) * (B.kind==='elite'?1.25:1);
  const gold=Math.round(B.enemies.reduce((a,e)=>a+e.gold,0)*rnd(.85,1.2)*(B.kind==='elite'?1.3:1));
  S.gold+=gold;
  // Beute
  const loot=[]; const commons=Object.keys(ITEMS).filter(k=>ITEMS[k].common), rares=['entwasser','sternenglas'];
  if(B.kind==='normal'){ if(Math.random()<.4) loot.push(pick(commons)); }
  else if(B.kind==='elite'){ loot.push(pick(commons)); if(Math.random()<.5) loot.push(pick(rares)); }
  else { loot.push(pick(commons),pick(commons),pick(rares)); }
  loot.forEach(k=>S.items[k]=(S.items[k]||0)+1);
  // Gefallene stehen nach dem Kampf mit 1 LP wieder auf
  S.party.forEach(h=>{ if(h.hp<=0) h.hp=1; });
  const lines=S.party.map(h=>{ const r=grantXp(h,Math.round(xp)); return {h,...r}; });
  save();
  const last = B.kind==='boss' && S.ch===CH.length-1;
  screen(`<div class="center-screen ${CH[S.ch].bg}"><div class="wrap"><div class="panel" style="max-width:620px;margin:0 auto">
    <div class="eyebrow">${B.kind==='boss'?'Boss bezwungen':'Sieg'}</div>
    <h2 style="font-size:32px;color:var(--gold-2)">${last?'Der Dunkle Herrscher fällt!':B.kind==='boss'?'Der Weg ist frei':'Die Feinde weichen'}</h2>
    <div class="reward-list">
      <div class="rl"><span class="em">◈</span><span>+${gold} Gold · +${Math.round(xp)} EP für jeden Gefährten</span></div>
      ${loot.length?`<div class="rl"><span class="em">✚</span><span>Beute: ${loot.map(k=>ITEMS[k].n).join(', ')}</span></div>`:''}
      ${lines.map(l=>{ const b=HEROES[l.h.key]; return `<div class="rl"><span class="em">${b.i}</span><span style="min-width:96px">${b.n} · St. ${l.h.lvl}</span><div class="xpb">${bar('mp',l.h.xp,xpNeed(l.h.lvl))}</div>${l.ups?`<span class="lvlup">Stufe ${l.h.lvl}!${l.learned.length?' Neu: '+l.learned.join(', '):''}</span>`:''}</div>`; }).join('')}
    </div>
    <button class="btn primary" id="b-on">Weiter</button></div></div></div>`);
  if(lines.some(l=>l.ups)) setTimeout(()=>sfx('level'),400);
  $('#b-on').onclick=()=>{ sfx('click'); nodeDone(); };
}
function grantXp(h,xp){
  h.xp+=xp; let ups=0; const learned=[];
  while(h.xp>=xpNeed(h.lvl)){
    h.xp-=xpNeed(h.lvl); const before=heroStats(h); h.lvl++; ups++; const after=heroStats(h);
    h.hp=Math.min(after.maxHp, h.hp+(after.maxHp-before.maxHp)+Math.round(after.maxHp*.2));
    h.mp=Math.min(after.maxMp, h.mp+(after.maxMp-before.maxMp)+Math.round(after.maxMp*.2));
    HEROES[h.key].sk.forEach(id=>{ if(SKILLS[id].lvl===h.lvl) learned.push(SKILLS[id].n); });
  }
  return {ups,learned};
}

    app.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>smith(+b.dataset.r,'arm'));
    $('#b-leave').onclick=()=>{ sfx('click'); nodeDone(); };
  };
  draw();
}

     {l:'Um Rat bitten (EP für alle)',fn:()=>{ S.party.forEach(h=>grantXp(h,Math.round(xpNeed(h.lvl)*.35))); sfx('level'); result('Alte Weisheit','Ihre Worte schärfen euren Blick für den Kampf.'); }}]),
  ()=>simpleScreen('Begegnung','Eine verlassene Schmiede',

  ()=>simpleScreen('Begegnung','Eine moosbewachsene Truhe',
    `<p>In einem alten Hügelgrab steht eine eisenbeschlagene Truhe. Die Luft ist kalt, und irgendwo scharrt etwas.</p>`,
    [{l:'Öffnen',fn:()=>{ if(Math.random()<.6){ const g=ri(45,90); S.gold+=g; S.items.athelas++; result('Schatz!',`${g} Gold und ein Bündel Athelas.`);} else { simpleScreen('Hinterhalt!','Die Wächter erwachen',`<p>Aus den Schatten treten Feinde hervor!</p>`,[{l:'Kämpfen',fn:()=>{ S.gold+=30; const c=CH[S.ch]; startBattle(pick(c.normal),c.lvl,'normal'); }}]); } }},
     {l:'Liegen lassen',fn:()=>result('Vorsicht','Manche Schätze bleiben besser, wo sie sind.')}]),
  ()=>simpleScreen('Begegnung','Der Spiegel der Herrin',

    [{l:'Hineinblicken (viele EP, Ringlast sinkt)',fn:()=>{ S.party.forEach(h=>{ grantXp(h,Math.round(xpNeed(h.lvl)*.6)); if(h.key==='frodo') h.corruption=Math.max(0,(h.corruption||0)-50); }); sfx('level'); result('Visionen','Ihr seht Feuer und Hoffnung, und kehrt entschlossener zurück.'); }},
